<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DILG Aklan - Login</title>
  <link rel="stylesheet" href="login_styles.css">
</head>
<body>

<div class="page">
  <div class="card">

    <div class="left">

      <!-- LOGIN -->
      <div id="loginBox">
        <h1>Welcome to DILG Aklan!</h1>

        <form id="loginForm" class="form" method="POST" action="login.php">
          <input type="text" id="loginUsername" name="username" placeholder="Username" required>
          <input type="password" id="loginPassword" name="password" placeholder="Password" required>
          <button type="submit" class="btn">Sign in</button>
        </form>

        <button id="goRegister" class="link-btn" type="button">Register</button>
        <p class="hint" id="loginMsg"></p>
      </div>

      <!-- REGISTER -->
      <div id="registerBox" class="hidden">
        <h1>Create an Account</h1>

        <!-- ✅ error message directly under title -->
        <p class="hint" id="registerMsg"></p>

        <form id="registerForm" class="form" method="POST" action="register.php">
          <input type="text" id="regUsername" name="username" placeholder="Username" required>
          <input type="password" id="regPassword" name="password" placeholder="Password" required>

          <select id="regMunicipality" name="municipality" required>
            <option value="" disabled selected>Select municipality</option>
            <option value="Altavas">Altavas</option>
            <option value="Balete">Balete</option>
            <option value="Banga">Banga</option>
            <option value="Batan">Batan</option>
            <option value="Buruanga">Buruanga</option>
            <option value="Ibajay">Ibajay</option>
            <option value="Kalibo">Kalibo</option>
            <option value="Lezo">Lezo</option>
            <option value="Libacao">Libacao</option>
            <option value="Madalag">Madalag</option>
            <option value="Makato">Makato</option>
            <option value="Malay">Malay</option>
            <option value="Malinao">Malinao</option>
            <option value="Nabas">Nabas</option>
            <option value="New Washington">New Washington</option>
            <option value="Numancia">Numancia</option>
            <option value="Tangalan">Tangalan</option>
          </select>

          <button type="submit" class="btn secondary">Register</button>
        </form>

        <button id="goLogin" class="link-btn" type="button">Back to Login</button>
      </div>

    </div>

    <div class="right">
      <img src="Screenshot 2026-01-30 114359.png" alt="DILG Aklan">
    </div>

  </div>
</div>

<!-- ✅ cache-bust so browser loads the newest JS -->
<script src="login_scripts.js?v=999"></script>
</body>
</html>
